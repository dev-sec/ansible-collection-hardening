---
name: "devsec.macos_hardening"
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'roles/macos_hardening/**'
      - 'molecule/macos_hardening/**'
      - '.github/workflows/macos_hardening.yml'
      - 'requirements.txt'
  pull_request:
    branches: [master, main]
    paths:
      - 'roles/macos_hardening/**'
      - 'molecule/macos_hardening/**'
      - '.github/workflows/macos_hardening.yml'
      - 'requirements.txt'
  schedule:
    - cron: '0 6 * * 3'

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

jobs:
  build:
    name: Test macOS Hardening Role on macOS Runner
    runs-on: macos-latest
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: ansible_collections/devsec/hardening

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ansible_collections/devsec/hardening

      - name: Validate Role Defaults & Argument Specs
        run: |
          python -c "import yaml; yaml.safe_load(open('roles/macos_hardening/defaults/main.yml')); yaml.safe_load(open('roles/macos_hardening/meta/argument_specs.yml'))"
        working-directory: ansible_collections/devsec/hardening

      - name: Test Playbook Check Mode
        run: |
          ansible-playbook -i "localhost," -c local molecule/macos_hardening/converge.yml --check
        working-directory: ansible_collections/devsec/hardening
        continue-on-error: true

      - name: Test Playbook Apply
        run: |
          sudo ansible-playbook -i "localhost," -c local molecule/macos_hardening/converge.yml
        working-directory: ansible_collections/devsec/hardening
