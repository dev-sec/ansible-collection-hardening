---
name: "devsec.macos_hardening"
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'roles/macos_hardening/**'
      - 'molecule/macos_hardening/**'
      - '.github/workflows/macos_hardening.yml'
      - 'requirements.txt'
  pull_request:
    branches: [master, main]
    paths:
      - 'roles/macos_hardening/**'
      - 'molecule/macos_hardening/**'
      - '.github/workflows/macos_hardening.yml'
      - 'requirements.txt'
  schedule:
    - cron: '0 6 * * 3'

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

jobs:
  build:
    name: Test macOS Hardening Role on macOS Runner
    runs-on: macos-latest
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: ansible_collections/devsec/hardening

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install community.general
        working-directory: ansible_collections/devsec/hardening

      - name: Validate Role Defaults & Argument Specs
        working-directory: ansible_collections/devsec/hardening
        run: |
          python -c "import yaml; yaml.safe_load(open('roles/macos_hardening/defaults/main.yml'))"
          python -c "import yaml; yaml.safe_load(open('roles/macos_hardening/meta/argument_specs.yml'))"

      - name: Test Playbook Check Mode
        working-directory: ansible_collections/devsec/hardening
        run: |
          ansible-playbook -i "localhost," -c local molecule/macos_hardening/converge.yml --check
        env:
          ANSIBLE_ROLES_PATH: roles
        continue-on-error: true

      - name: Test Playbook Apply
        working-directory: ansible_collections/devsec/hardening
        run: |
          sudo env "PATH=$PATH" "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/ansible_collections/devsec/hardening/roles" ansible-playbook -i "localhost," -c local molecule/macos_hardening/converge.yml
