---
- name: Network | Enable Application Firewall
  ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
  changed_when: false

- name: Network | Enable Firewall Stealth Mode
  ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
  changed_when: false

- name: Network | Disable AirDrop
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.applicationaccess
    key: allowAirDrop
    type: bool
    value: false

- name: Network | Disable AirPlay Receiver
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.applicationaccess
    key: allowAirPlayIncomingRequests
    type: bool
    value: false

- name: Network | Enable network time synchronization
  ansible.builtin.command: /usr/sbin/systemsetup -setusingnetworktime on
  register: macos_nettime_result
  when: macos_manage_network_time | bool
  changed_when: false
  failed_when:
    - macos_nettime_result.rc != 0
    - "'requires Full Disk Access' not in macos_nettime_result.stdout"
    - "'requires Full Disk Access' not in macos_nettime_result.stderr"

- name: Network | Configure network time server
  ansible.builtin.command: "/usr/sbin/systemsetup -setnetworktimeserver {{ macos_time_server | quote }}"
  when:
    - macos_manage_network_time | bool
    - macos_time_server is defined and macos_time_server | length > 0
  register: macos_timeserver_result
  changed_when: false
  failed_when:
    - macos_timeserver_result.rc != 0
    - "'requires Full Disk Access' not in macos_timeserver_result.stdout"
    - "'requires Full Disk Access' not in macos_timeserver_result.stderr"

- name: Network | Report missing Full Disk Access for network time setup
  ansible.builtin.debug:
    msg: "Notice: Network time configuration via systemsetup was requested but requires Full Disk Access (FDA) privileges."
  when:
    - macos_manage_network_time | bool
    - (macos_nettime_result is defined and macos_nettime_result.rc != 0) or (macos_timeserver_result is defined and macos_timeserver_result.rc != 0)
    - "'requires Full Disk Access' in (macos_nettime_result.stdout | default('')) or 'requires Full Disk Access' in (macos_timeserver_result.stdout | default(''))"

- name: Network | Disable mDNSResponder multicast advertisements
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.mDNSResponder
    key: NoMulticastAdvertisements
    type: bool
    value: true

- name: Network | Disable Apache HTTP server launchd service
  ansible.builtin.command: /bin/launchctl disable system/org.apache.httpd
  changed_when: false

- name: Network | Disable NFS server daemon launchd service
  ansible.builtin.command: /bin/launchctl disable system/com.apple.nfsd
  changed_when: false
