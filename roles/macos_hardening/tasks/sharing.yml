---
- name: Sharing | Disable Screen Sharing launchd service
  ansible.builtin.command: /bin/launchctl disable system/com.apple.screensharing
  changed_when: false

- name: Sharing | Disable File Sharing launchd service
  ansible.builtin.command: /bin/launchctl disable system/com.apple.smbd
  changed_when: false

- name: Sharing | Disable Printer Sharing via cupsctl
  ansible.builtin.command: /usr/sbin/cupsctl --no-share-printers
  changed_when: false

- name: Sharing | Disable Remote Login SSH service
  ansible.builtin.command: /usr/sbin/systemsetup -f -setremotelogin off
  when:
    - not (macos_manage_remote_login | bool)
    - macos_disable_remote_login | default(false) | bool
  changed_when: false

- name: Sharing | Check if ARD kickstart tool exists
  ansible.builtin.stat:
    path: /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
  register: macos_ard_kickstart

- name: Sharing | Disable Remote Management ARD service
  ansible.builtin.command: /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop
  when:
    - not (macos_manage_remote_management | bool)
    - macos_ard_kickstart.stat.exists
  changed_when: false

- name: Sharing | Disable Remote Apple Events
  ansible.builtin.command: /usr/sbin/systemsetup -f -setremoteappleevents off
  changed_when: false

- name: Sharing | Disable Internet Sharing
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.MCX
    key: forceInternetSharingOff
    type: bool
    value: true

- name: Sharing | Disable Content Caching
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.applicationaccess
    key: allowContentCaching
    type: bool
    value: false

- name: Sharing | Disable Media Sharing
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.applicationaccess
    key: allowMediaSharing
    type: bool
    value: false

- name: Sharing | Disable Bluetooth file sharing
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.Bluetooth
    key: PrefKeyServicesEnabled
    type: bool
    value: false
