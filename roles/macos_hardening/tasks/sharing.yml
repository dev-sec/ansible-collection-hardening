---
- name: Sharing | Disable Screen Sharing launchd service
  ansible.builtin.command: /bin/launchctl disable system/com.apple.screensharing
  changed_when: false

- name: Sharing | Disable File Sharing launchd service
  ansible.builtin.command: /bin/launchctl disable system/com.apple.smbd
  changed_when: false

- name: Sharing | Disable Printer Sharing via cupsctl
  ansible.builtin.command: /usr/sbin/cupsctl _share_printers=0
  changed_when: false

- name: Sharing | Disable Remote Login SSH service
  ansible.builtin.command: /bin/launchctl disable system/com.openssh.sshd
  when:
    - macos_disable_remote_login | bool
    - not (macos_manage_remote_login | bool)
  changed_when: false

- name: Sharing | Check if ARD kickstart tool exists
  ansible.builtin.stat:
    path: /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
  register: macos_ard_kickstart
  when: macos_manage_remote_management | bool

- name: Sharing | Disable Remote Management ARD service
  ansible.builtin.command: /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop
  when:
    - macos_manage_remote_management | bool
    - macos_ard_kickstart.stat is defined and macos_ard_kickstart.stat.exists
  changed_when: false

- name: Sharing | Report missing ARD kickstart tool when Remote Management managed
  ansible.builtin.debug:
    msg: "Notice: Remote Management (ARD) management was requested but kickstart tool was not found on target host."
  when:
    - macos_manage_remote_management | bool
    - macos_ard_kickstart.stat is defined and not macos_ard_kickstart.stat.exists

- name: Sharing | Disable Remote Apple Events
  ansible.builtin.command: /usr/sbin/systemsetup -f -setremoteappleevents off
  register: macos_apple_events_result
  when: macos_manage_remote_apple_events | bool
  changed_when: false
  failed_when:
    - macos_apple_events_result.rc != 0
    - "'requires Full Disk Access' not in macos_apple_events_result.stdout"
    - "'requires Full Disk Access' not in macos_apple_events_result.stderr"

- name: Sharing | Report missing Full Disk Access for Remote Apple Events
  ansible.builtin.debug:
    msg: "Notice: Disabling Remote Apple Events via systemsetup was requested but requires Full Disk Access (FDA) privileges."
  when:
    - macos_manage_remote_apple_events | bool
    - macos_apple_events_result is defined
    - macos_apple_events_result.rc != 0
    - "'requires Full Disk Access' in (macos_apple_events_result.stdout | default('')) or 'requires Full Disk Access' in (macos_apple_events_result.stderr | default(''))"

- name: Sharing | Disable Internet Sharing
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.MCX
    key: forceInternetSharingOff
    type: bool
    value: true

- name: Sharing | Disable Content Caching
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.applicationaccess
    key: allowContentCaching
    type: bool
    value: false

- name: Sharing | Disable Media Sharing
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.applicationaccess
    key: allowMediaSharing
    type: bool
    value: false

- name: Sharing | Disable Bluetooth file sharing
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.Bluetooth
    key: PrefKeyServicesEnabled
    type: bool
    value: false
