---
- name: Security | Enable Location Services
  community.general.osx_defaults:
    domain: /var/db/locationd/Library/Preferences/ByHost/com.apple.locationd
    key: LocationServicesEnabled
    type: int
    value: 1

- name: Security | Disable Analytics & Improvements data sharing
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.SubmitDiagInfo
    key: AutoSubmit
    type: bool
    value: false

- name: Security | Disable Siri voice assistant
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.assistant.support
    key: "Assistant Enabled"
    type: bool
    value: false

- name: Security | Disable Siri data sharing
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.assistant.support
    key: "Siri Data Sharing Opt In Status"
    type: int
    value: 2

- name: Security | Restrict Advertising tracking
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.AdLib
    key: allowApplePersonalizedAdvertising
    type: bool
    value: false

- name: Security | Disable Apple Intelligence cloud sync
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.intelligence
    key: cloudSyncEnabled
    type: bool
    value: false

- name: Security | Disable Apple personalized advertising
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.applicationaccess
    key: allowApplePersonalizedAdvertising
    type: bool
    value: false

- name: Security | Enable Gatekeeper assessment
  ansible.builtin.command: /usr/sbin/spctl --enable
  register: macos_spctl_result
  when: macos_enable_assessment | bool
  changed_when: false
  failed_when:
    - macos_spctl_result.rc != 0
    - "'no longer supported' not in macos_spctl_result.stderr"

- name: Security | Report spctl CLI deprecation for Gatekeeper
  ansible.builtin.debug:
    msg: "Notice: spctl --enable is deprecated on macOS 15/26 Tahoe. Gatekeeper assessment is enforced via System Policy configuration profile payload."
  when:
    - macos_enable_assessment | bool
    - macos_spctl_result is defined
    - "'no longer supported' in (macos_spctl_result.stderr | default(''))"

- name: Security | Require administrator password for System Preferences
  ansible.builtin.command:
    cmd: /usr/bin/security authorizationdb write system.preferences
    stdin: "<plist version=\"1.0\"><dict><key>class</key><string>user</string><key>group</key><string>admin</string><key>shared</key><false/></dict></plist>"
  register: macos_authdb_result
  when: macos_manage_authorizationdb | bool
  changed_when: false
  failed_when: macos_authdb_result.rc != 0 and macos_authdb_result.rc != 255

- name: Security | Report non-interactive GUI limitation for authorizationdb
  ansible.builtin.debug:
    msg: "Notice: System Preferences authorizationdb configuration was requested but requires an active GUI Security session."
  when:
    - macos_manage_authorizationdb | bool
    - macos_authdb_result is defined
    - macos_authdb_result.rc == 255

- name: Security | Discover user home directories on remote target
  ansible.builtin.find:
    paths: /Users
    file_type: directory
    excludes: ['Shared', 'Guest']
  register: macos_user_homes

- name: Security | Restrict permissions on user home folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: '0700'
  loop: "{{ macos_user_homes.files | default([]) }}"
  when: macos_user_homes.files is defined and macos_user_homes.files | length > 0

- name: Security | Configure sudo security drop-in file
  ansible.builtin.copy:
    dest: /etc/sudoers.d/sudoers_security
    content: |
      Defaults timestamp_timeout={{ macos_sudo_timestamp_timeout }}
      Defaults tty_tickets
    owner: root
    group: wheel
    mode: '0440'

- name: Security | Create PolicyBanner text file if warning content specified
  ansible.builtin.copy:
    dest: /Library/Security/PolicyBanner.txt
    content: "{{ macos_policy_banner_content }}\n"
    owner: root
    group: wheel
    mode: '0644'
  when: macos_policy_banner_content | default('') | length > 0

- name: Security | Ensure PolicyBanner file absent if no warning content specified
  ansible.builtin.file:
    path: /Library/Security/PolicyBanner.txt
    state: absent
  when: macos_policy_banner_content | default('') | length == 0
