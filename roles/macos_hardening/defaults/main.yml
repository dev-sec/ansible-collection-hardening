# SoftwareUpdate payload values
macos_softwareupdate_automatic_download: true
macos_softwareupdate_automatic_macos_updates: true
macos_softwareupdate_automatic_app_updates: true
macos_softwareupdate_config_data_install: true
macos_softwareupdate_critical_update_install: true
macos_appstore_autoupdate: true

# iCloud restrictions
macos_allow_cloud_desktop_and_documents: false

# Firewall payload values
macos_firewall_enable: true
macos_firewall_stealth: true

# Application access payload values
macos_allow_airdrop: false
macos_allow_airplay_incoming: false
macos_allow_content_caching: false
macos_allow_media_sharing: false
macos_allow_media_sharing_modification: false
macos_allow_external_intelligence_integrations: false
macos_allow_external_intelligence_integrations_signin: false
macos_allow_writing_tools: false
macos_allow_mail_summary: false
macos_allow_notes_transcription: false
macos_allow_notes_transcription_summary: false
macos_allow_diagnostic_submission: false
macos_allow_apple_personalized_advertising: false
macos_allow_game_center: false
macos_force_on_device_only_dictation: true
macos_allow_assistant: false

# Bonjour/mDNS payload value
macos_nomulticast_advertisements: true

# Location menu payload values
macos_show_system_services_location_icon: true
macos_location_services_enabled: true

# SubmitDiagInfo payload value
macos_auto_submit_diag_info: false

# Assistant support payload values
macos_siri_data_sharing_opt_in_status: 2
macos_search_queries_data_sharing_status: 2

# Accessibility payload value
macos_assistive_voice_improvement_enabled: false

# System policy payload values
macos_allow_identified_developers: true
macos_enable_assessment: true

# MCX payload values
macos_dont_allow_fde_disable: true
macos_disable_guest_account: true
macos_enable_guest_account: false
macos_force_internet_sharing_off: true

# Universal Control payload
macos_universal_control_disabled: true

# Time Machine, energy saver, and lock screen settings
macos_time_machine_auto_backup: true
macos_time_machine_max_backup_age_hours: 24
macos_sleep_minutes: 15
macos_display_sleep_minutes: 10
macos_power_nap_enabled: false
macos_wake_on_network_access_enabled: false
macos_screensaver_idle_time: 900
macos_screensaver_ask_for_password: true
macos_screensaver_ask_for_password_delay: 0
macos_hot_corner_top_left: 0
macos_hot_corner_top_right: 0
macos_hot_corner_bottom_left: 0
macos_hot_corner_bottom_right: 0
macos_automatic_login_disabled: true

# Terminal payload value
macos_secure_keyboard_entry: true

# Safari payload values (profile-managed)
macos_safari_auto_open_safe_downloads: false
macos_safari_warn_about_fraudulent_websites: true
macos_safari_block_storage_policy: 2
macos_safari_webkit_storage_blocking_policy: 1
macos_safari_webkit_preferences_storage_blocking_policy: 1
macos_safari_private_click_measurement_enabled: true
macos_safari_show_full_url: true
macos_safari_show_status_bar: true
