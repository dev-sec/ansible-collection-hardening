# Security, Authorization & Privacy settings
macos_location_services_enabled: true
macos_location_system_services_icon_enabled: true
macos_submit_diag_info_enabled: false
macos_assistant_enabled: false
macos_siri_data_sharing_opt_in_status: 2
macos_apple_personalized_advertising_enabled: false
macos_apple_intelligence_cloud_sync_enabled: false
macos_gatekeeper_assessment_enabled: true
macos_gatekeeper_allow_identified_developers: true
macos_authorizationdb_system_preferences_manage: true
macos_chmod_home_folders: true
macos_sudo_timestamp_timeout: 0
macos_sudoers_file: 10_macos_hardening
