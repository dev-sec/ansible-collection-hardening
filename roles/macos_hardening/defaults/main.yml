---
# DevSec macOS Hardening Role Defaults

# Main role enablement toggle
macos_hardening_enabled: true

# CIS Apple macOS 26 Tahoe Benchmark level (1 or 2; Level 2 includes Level 1)
macos_cis_level: 2

# Subsystem category switches
macos_update_enabled: true
macos_sharing_enabled: true
macos_network_enabled: true
macos_system_enabled: true
macos_security_enabled: true
macos_account_enabled: true
macos_audit_enabled: true
macos_safari_enabled: true
macos_profile_enabled: true

# Target user discovery settings
macos_hardening_users: []
macos_hardening_discover_users: true

# Specific feature policy toggles
macos_manage_remote_login: false
macos_disable_remote_login: false
macos_manage_remote_management: false
macos_manage_game_center: false
macos_manage_universal_control: false
macos_manage_safari_history: false
macos_manage_safari_hide_ip: false

# Software Update settings
macos_install_apple_updates: true
macos_software_update_agree_to_license: false
macos_allow_major_version_deferral: true
macos_software_update_restart: false
macos_software_update_defer_enabled: false
macos_software_update_defer_days: 30

# Time settings
macos_time_server: time.apple.com
macos_time_zone: UTC
macos_time_zone_enabled: false

# Safari settings
macos_safari_history_age_days: 365
macos_safari_hide_ip_setting: 33422564 # 33422560=Disabled, 33422564=Trackers Only, 33422572=Trackers+Websites

# Password policy settings
macos_password_max_failed_attempts: 5
macos_password_min_length: 15
macos_password_require_alpha: 1
macos_password_require_numeric: 1
macos_password_require_symbol: 1
macos_password_require_mixed_case: 1
macos_password_max_age_days: 365
macos_password_history_depth: 24

# Audit settings
macos_audit_flags: "aa,ad,lo,-all"
macos_audit_expire_after: "30d"
macos_install_log_ttl: 365

# Security & sudo settings
macos_sudo_timestamp_timeout: 0
macos_sudoers_file: 10_macos_hardening

# Login window and banner messages
macos_show_fullname_loginwindow: true
macos_retries_until_hint: 0
macos_login_window_message: ''
macos_policy_banner_content: ''

# Configuration profile deployment settings
# Controls whether the generated configuration profile is installed directly on the local machine.
# Default is true for direct standalone/home-user installation. Set to false when serving the
# profile to an MDM server for remote fleet distribution.
macos_profile_install: true
macos_profile_path: /tmp/macos_hardening.mobileconfig
macos_profile_identifier: com.devsec.macos_hardening
macos_profile_display_name: DevSec macOS Hardening
macos_profile_description: DevSec macOS hardening configuration profile
macos_profile_organization: DevSec Hardening Framework Team
macos_profile_uuid: 89692235-d2cb-47be-93d9-1d9b30416630

# Profile payload toggles
macos_profile_softwareupdate_enabled: true
macos_profile_firewall_enabled: true
macos_profile_applicationaccess_enabled: true
macos_profile_mdns_enabled: true
macos_profile_locationmenu_enabled: true
macos_profile_submitdiag_enabled: true
macos_profile_assistant_support_enabled: true
macos_profile_accessibility_enabled: true
macos_profile_systempolicy_enabled: true
macos_profile_mcx_enabled: true
macos_profile_universalcontrol_enabled: true
macos_profile_loginwindow_enabled: true
macos_profile_terminal_enabled: true
macos_profile_safari_enabled: true
macos_profile_passwordpolicy_enabled: true
macos_profile_timemachine_enabled: true
macos_profile_dock_enabled: true
macos_profile_screensaver_enabled: true

# Payload UUIDs (static for idempotency)
macos_profile_uuid_softwareupdate: 3bc15b0f-4041-4d1b-a044-6eb69248cba0
