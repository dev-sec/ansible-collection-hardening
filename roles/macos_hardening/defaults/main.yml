---
# DevSec macOS Hardening Role Defaults

# Main role enablement toggle
macos_hardening_enabled: true

# Subsystem category switches
macos_update_enabled: true
macos_sharing_enabled: true
macos_network_enabled: true
macos_system_enabled: true
macos_security_enabled: true
macos_account_enabled: true
macos_audit_enabled: true
macos_safari_enabled: true
