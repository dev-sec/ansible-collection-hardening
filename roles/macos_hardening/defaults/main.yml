macos_universal_control_enabled: false

# Account policy settings
macos_guest_account_enabled: false
macos_guest_file_sharing_enabled: false
macos_automatic_login_disabled: true
macos_password_lockout_seconds: 900
macos_password_max_failed_attempts: 5
macos_password_min_length: 15
macos_password_require_alpha: 1
macos_password_require_numeric: 1
macos_password_require_symbol: 1
macos_password_require_mixed_case: 1
macos_password_max_age_days: 365
macos_password_history_depth: 24

# Audit settings
macos_audit_flags: "aa,ad,lo,-all"
macos_audit_expire_after: "30d"
macos_install_log_ttl: 365

# Safari & Terminal settings
